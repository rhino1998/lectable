<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lectable</title>
    <script>
      // Applies a saved manual theme choice before first paint, so a
      // dark-theme user doesn't see a flash of the light (or system)
      // palette while React/useTheme.ts spins up.
      ;(function () {
        try {
          var t = localStorage.getItem('lectable:theme')
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
